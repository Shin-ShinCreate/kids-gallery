name = "kids-gallery-api"
main = "worker.js"
compatibility_date = "2025-06-01"

# 作品・ことばの記録（D1）。database_id は `wrangler d1 create` の結果で置き換える
[[d1_databases]]
binding = "DB"
database_name = "kids-gallery"
database_id = "66e974fa-f096-433b-a2f3-a2859c3895de"

# 写真・声のファイル置き場（R2）
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "kids-gallery-blobs"

[vars]
ALLOWED_ORIGINS = "https://shin-shincreate.github.io,http://localhost:8765,http://127.0.0.1:8765"
# プッシュ通知（作品が追加されたときのお知らせ）の公開鍵。秘密鍵は `wrangler secret put VAPID_PRIVATE_KEY` で登録する
VAPID_PUBLIC_KEY = "BJ002B3dVhZ0UBLzIOR-iiZB-bnayMOvPmgBDAI4xfno9mdrXq4pp6-Yc8zzVPZKsJk4MfvrNhGpKgKF61Ky6e8"
VAPID_SUBJECT = "https://shin-shincreate.github.io/kids-gallery/"
